<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nod off Alarm - 瞌睡警報器1102</title>
    
    <!-- p5.js 與 ml5.js (完全保留你指定的套件版本) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
      :root {
        --bg-color: #121212;
        --panel-bg: rgba(30, 30, 30, 0.75);
        --text-color: #e0e0e0;
        --safe-color: #00e676;   /* 霓虹綠 */
        --alarm-color: #ff3d00;  /* 霓虹紅 */
        --loading-color: #ffea00;/* 霓虹黃 */
        --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* 畫布樣式 */
      canvas {
        display: block;
        box-shadow: var(--shadow);
      }

      /* 玻璃擬物風格控制面板 */
      #ui-panel {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 15px 20px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        transition: all 0.3s ease;
      }

      /* 手機橫擺（Landscape）自動調整介面位置 */
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #ui-panel {
          bottom: auto;
          top: 15px;
          right: 15px;
          left: auto;
          transform: none;
          width: 180px;
          padding: 10px;
        }
      }

      .status-container {
        display: flex;
        align-items: center;
        width: 100%;
        justify-content: center;
      }

      /* 霓虹指示燈 */
      #status-led {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 10px;
        transition: background 0.3s ease, box-shadow 0.3s ease;
      }

      #status-text {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 0;
      }

      /* 狀態燈號顏色定義 */
      .st-loading { 
        background-color: var(--loading-color); 
        box-shadow: 0 0 10px var(--loading-color); 
        color: var(--loading-color);
      }
      .st-safe { 
        background-color: var(--safe-color); 
        box-shadow: 0 0 10px var(--safe-color);
        color: var(--safe-color);
      }
      .st-alarm { 
        background-color: var(--alarm-color); 
        box-shadow: 0 0 15px var(--alarm-color);
        color: var(--alarm-color);
        animation: pulse 1.2s infinite;
      }

      #info-meta {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin: 6px 0 0 0;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 5px var(--alarm-color); }
        50% { box-shadow: 0 0 20px var(--alarm-color); }
        100% { box-shadow: 0 0 5px var(--alarm-color); }
      }
    </style>
  </head>

  <body>
    <!-- UI 狀態提示面板 -->
    <div id="ui-panel">
      <div class="status-container">
        <div id="status-led" class="st-loading"></div>
        <p id="status-text">初始化中...</p>
      </div>
      <p id="info-meta">正在載入 AI 模型...</p>
    </div>

    <script>
      let video;
      let facemesh;
      let predictLabel = "清醒"; 
      let predictions = [];         
      let nn;                       
      let isLoadingModel = true;    
      let isPredicting = false;     

      // 預設影像基準尺寸
      let idealVidW = 640;
      let idealVidH = 480;

      // 觸發閾值設定（1 次立刻觸發）
      let drowsyCounter = 0;
      const DROWSY_THRESHOLD = 1;

      // DOM UI 元素
      let domLed, domText, domMeta;

      // ---------- p5.js setup ----------
      function setup() {
        createCanvas(windowWidth, windowHeight);
        
        // 取得 UI DOM 節點
        domLed = select('#status-led');
        domText = select('#status-text');
        domMeta = select('#info-meta');

        // 啟動鏡頭（針對行動裝置優化）
        video = createCapture(VIDEO, function(stream) {
          if (video.elt && video.elt.videoWidth) {
            idealVidW = video.elt.videoWidth;
            idealVidH = video.elt.videoHeight;
          }
        });
        video.size(idealVidW, idealVidH);
        video.hide(); 

        // 初始化神經網路 (ml5.js 0.6.1)
        const options = {
          inputs: 1044, // 348 點 * 3 (XYZ)
          outputs: 2,
          task: 'classification',
          debug: false
        };
        nn = ml5.neuralNetwork(options);

        // 載入 FaceMesh
        facemesh = ml5.facemesh(video, faceModelReady);
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }

      // ---------- 模型載入流程 ----------
      function faceModelReady() {
        console.log("FaceMesh 載入完成");
        facemesh.on("predict", gotFaceResult);
        uploadModel(); 
      }

      function uploadModel() {
        const modelInfo = {
          model: 'model.json',
          metadata: 'model_meta.json',
          weights: 'model.weights.bin',
        };
        nn.load(modelInfo, modelLoaded);
      }

      function modelLoaded() {
        console.log("分類器模型載入完成");
        isLoadingModel = false;
        domMeta.html("AI 瞌睡監控中");
      }

      // ---------- 特徵點處理與分類 ----------
      function gotFaceResult(faceResults) {
        predictions = faceResults;
        
        if (predictions.length > 0 && !isLoadingModel && !isPredicting) {
          predictData();
        }
      }

      function predictData() {
        let inputData = [];
        if (predictions.length > 0 && predictions[0].scaledMesh) {
          const mesh = predictions[0].scaledMesh;
          for (let j = 0; j < mesh.length; j++) {
            inputData.push(mesh[j][0]); // X
            inputData.push(mesh[j][1]); // Y
            inputData.push(mesh[j][2]); // Z
          }
        }

        if (inputData.length === 1044) {
          isPredicting = true;
          nn.classify([inputData], gotResults);
        }
      }

      function gotResults(error, results) {
        isPredicting = false;

        if (error) {
          return;
        }

        if (results && results.length > 0) {
          let rawLabel = results[0].label;

          // 1 次即可觸發機制
          if (rawLabel === "打瞌睡") {
            drowsyCounter++;
            if (drowsyCounter >= DROWSY_THRESHOLD) {
              predictLabel = "打瞌睡";
            }
          } else {
            drowsyCounter = 0;
            predictLabel = "清醒";
          }
        }
      }

      // ---------- p5.js 畫布繪製 (跨裝置滿版對齊) ----------
      function draw() {
        background(15);

        // 動態計算影片於畫布上的大小與黑邊 Offset，維持正確寬高比
        let imgW = video.elt.videoWidth || idealVidW;
        let imgH = video.elt.videoHeight || idealVidH;

        let s = min(width / imgW, height / imgH);
        let newW = imgW * s;
        let newH = imgH * s;
        let dx = (width - newW) / 2;
        let dy = (height - newH) / 2;

        push();
        translate(dx + newW, dy); // 水平鏡像位移
        scale(-1, 1);
        
        // 1. 繪製鏡頭影像
        image(video, 0, 0, newW, newH);

        // 2. 打瞌睡時疊加警報濾鏡
        if (predictLabel === "打瞌睡") {
          push();
          fill(255, 0, 0, 70);
          rect(0, 0, newW, newH);
          pop();
        }

        // 3. 繪製響應式臉部特徵點
        drawResponsiveKeypoints(newW, newH, imgW, imgH);
        pop(); 

        // 4. 更新 UI 介面狀態
        updateUI();
      }

      // 核心演算法：將 FaceMesh 座標依比例映射至當前繪製解析度
      function drawResponsiveKeypoints(displayW, displayH, originalW, originalH) {
        if (predictions.length === 0) return;

        if (predictLabel === "打瞌睡") {
          fill(255, 80, 80, 220);
          noStroke();
        } else {
          fill(0, 230, 118, 220);
          noStroke();
        }

        const keypoints = predictions[0].scaledMesh;
        for (let j = 0; j < keypoints.length; j++) {
          // 歸一化轉當前畫布座標
          let ptX = (keypoints[j][0] / originalW) * displayW;
          let ptY = (keypoints[j][1] / originalH) * displayH;
          
          let ptSize = map(displayW, 320, 1920, 1.8, 3.5);
          ellipse(ptX, ptY, ptSize, ptSize);
        }
      }

      // 更新 HTML DOM 狀態
      function updateUI() {
        domLed.removeClass('st-loading');
        domLed.removeClass('st-safe');
        domLed.removeClass('st-alarm');
        domText.removeClass('st-safe');
        domText.removeClass('st-alarm');

        if (isLoadingModel) {
          domLed.addClass('st-loading');
          domText.html("載入模型中...");
        } else {
          if (predictions.length === 0) {
            domLed.addClass('st-loading');
            domText.html("尋找人臉中...");
            domText.style('color', '#fff');
          } else {
            domText.html(predictLabel);
            if (predictLabel === "打瞌睡") {
              domLed.addClass('st-alarm');
              domText.addClass('st-alarm');
            } else {
              domLed.addClass('st-safe');
              domText.addClass('st-safe');
            }
          }
        }
      }
    </script>
  </body>
</html>
