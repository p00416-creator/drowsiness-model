<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 疲勞駕駛監控系統</title>
  
  <!-- 載入必要前端函式庫：TensorFlow, p5.js, ml5.js, MQTT.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0/dist/tf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0 15px 0; }
    #canvas-container {
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
    }
    #webcam-video {
      display: none; /* 隱藏原生 Video 標籤，透過 p5 canvas 繪製 */
    }
  </style>
</head>
<body>

  <h2>🚨 疲勞駕駛 AI 偵測系統</h2>
  
  <div id="canvas-container"></div>
  <!-- 原生影音標籤 -->
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    // 💡 請替換為你真實的 GAS Web App (/exec) 網址
    const gasUrl = "https://script.google.com/macros/s/你的_DEPLOYMENT_ID/exec";

    // --------- MQTT 設定 (Adafruit IO) ---------
    let client;
    let connectMQTT = false;
    let mqttUsername = "we1688";
    let mqttPassword = "aio_QPfP05UOUn7pTKEh6Qjp9EIPQ9Mh";
    let mqttTopic = mqttUsername + "/feeds/alarm";

    let videoElement;
    let facemesh;
    let predictLabel = "";
    let predictions = [];
    let nn;
    
    let isCameraReady = false;
    let isFaceMeshReady = false;
    let isModelReady = false;

    let lastLabel = "";
    let videoSizeW = 640;
    let videoSizeH = 480;

    let userLat = "無";
    let userLng = "無";

    function updatePhoneLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude.toFixed(6);
            userLng = position.coords.longitude.toFixed(6);
            console.log(`📱 GPS 定位成功: ${userLat}, ${userLng}`);
          },
          (error) => console.warn("⚠️ 定位失敗: ", error.message),
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    }

    function sendToGAS(status) {
      if (!gasUrl || gasUrl.includes("你的_DEPLOYMENT_ID")) return;
      let payloadData = { status: status, lat: userLat, lng: userLng };
      fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payloadData)
      })
      .then(() => console.log(`✅ 狀態 [${status}] 已同步至 GAS！`))
      .catch(err => console.error("❌ 同步 GAS 失敗:", err));
    }

    function mqttSetup() {
      let mqttOptions = { username: mqttUsername, password: mqttPassword };
      client = mqtt.connect("wss://io.adafruit.com:443", mqttOptions);
      client.on("connect", () => {
        console.log("✅ 已成功連線 Adafruit IO MQTT！");
        connectMQTT = true;
      });
      client.on("error", (err) => console.error("❌ MQTT 錯誤:", err));
    }

    function getCurrentData() {
      let inputData = [];
      for (let i = 0; i < predictions.length; i++) {
        for (let j = 0; j < predictions[i].scaledMesh.length; j++) {
          for (let k = 0; k < predictions[i].scaledMesh[j].length; k++) {
            inputData.push(predictions[i].scaledMesh[j][k]);
          }
        }
      }
      return inputData;
    }

    function predictData() {
      if (isModelReady && predictions.length > 0) {
        let currentInputs = getCurrentData();
        if (currentInputs.length === 1044) {
          nn.classify([currentInputs], gotResults);
        }
      }
    }

    function checkStatus(){
      if(predictLabel !== lastLabel){
        console.log("🔄 狀態變更: " + predictLabel);
        if (predictLabel === "打瞌睡") updatePhoneLocation();
        
        sendToGAS(predictLabel);

        if (connectMQTT && client) {
          client.publish(mqttTopic, predictLabel);
          console.log("📡 已同步發送 MQTT: " + predictLabel);
        }
      }
      lastLabel = predictLabel;
    }

    function gotResults(error, results) {
      if (!error && results && results.length > 0) {
        predictLabel = results[0].label;
        checkStatus();
      }
    }

    function uploadModel() {
      console.log("⏳ 連線至 GitHub 下載自訂 AI 模型...");
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      nn.load(modelInfo, () => {
        console.log('✅ GitHub AI 模型讀取完成！');
        isModelReady = true;
      });
    }

    // 🎯 繪製 468 個臉部關鍵點（確保不受 tint 影響）
    function drawKeypoints() {  
      if (predictions && predictions.length > 0) {
        push(); // 隔離樣式設定
        noStroke();
        fill(0, 255, 0); // 螢光亮綠色
        
        for (let i = 0; i < predictions.length; i++) {
          const keypoints = predictions[i].scaledMesh;
          for (let j = 0; j < keypoints.length; j++) {
            const [x, y] = keypoints[j];
            ellipse(x, y, 4, 4); // 繪製直徑 4px 的圓點
          }
        }
        pop(); // 恢復原樣式
      }
    }

    function faceModelReady() {
      console.log("✅ FaceMesh 模型讀取完成！開始監聽臉部...");
      isFaceMeshReady = true;
      facemesh.on("predict", (results) => {
        predictions = results;
        if (predictions.length > 0) {
          // 在 Console 印出除錯訊息，確認有抓到臉
          // console.log("👤 抓到臉部數據，關鍵點數:", predictions[0].scaledMesh.length);
          predictData();
        }
      });
      uploadModel();
    }

    async function initCamera() {
      videoElement = document.getElementById('webcam-video');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: videoSizeW, height: videoSizeH },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = () => {
          console.log("📷 鏡頭畫面解析度已確認，啟動 FaceMesh 模型...");
          isCameraReady = true;
          // 確保鏡頭就緒後才初始化 ml5.facemesh
          facemesh = ml5.facemesh(videoElement, faceModelReady);
        };
      } catch (err) {
        console.error("❌ 無法取得攝影機畫面: ", err);
        alert("⚠️ 請授權攝影機使用權限！");
      }
    }

    function setup() {
      let canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent('canvas-container');

      updatePhoneLocation();

      // 初始化 ml5 神經網路
      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);

      mqttSetup();
      initCamera(); // 正式喚起鏡頭
    }

    function draw() {
      background(0);

      // 1. 繪製攝影機畫面
      if (isCameraReady && videoElement) {
        drawingContext.drawImage(videoElement, 0, 0, videoSizeW, videoSizeH);
      }

      // 2. 繪製綠色網格關鍵點
      drawKeypoints();   
      
      // 3. 繪製文字與狀態指示
      textAlign(CENTER, CENTER);
      if (predictLabel === "打瞌睡") {
        fill(255, 50, 50);
        textSize(60);
        textStyle(BOLD);
        text("⚠️ 請保持清醒！", width / 2, height / 3);
      } else if (!isFaceMeshReady || !isModelReady) {
        fill(0, 0, 0, 180);
        rect(0, 0, width, height); // 半透明遮罩
        
        fill(255, 255, 0);
        textSize(28);
        let msg = !isFaceMeshReady ? "⏳ FaceMesh 人臉模型載入中..." : "⏳ AI 分類模型下載中...";
        text(msg, width / 2, height / 2);
      }
    }
  </script>
</body>
</html>
