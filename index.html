<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- 針對行動裝置優化 Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI 瞌睡偵測系統1057</title>
    
    <!-- p5.js 與 ml5.js -->
 

     <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js" type="text/javascript"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
      :root {
        --bg-color: #121212;
        --panel-bg: rgba(30, 30, 30, 0.75);
        --text-color: #e0e0e0;
        --safe-color: #00e676; /* 霓虹綠 */
        --alarm-color: #ff3d00; /* 霓虹紅 */
        --loading-color: #ffea00; /* 霓虹黃 */
        --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        --accent: #2979ff;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; /* 防止捲動，專注於畫布 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        -webkit-touch-callout: none; /* 防止滑動選取 */
        -webkit-user-select: none;
        user-select: none;
      }

      /* p5.js 畫布樣式 */
      canvas {
        display: block;
        box-shadow: var(--shadow);
        object-fit: cover; /* 關鍵：讓畫布像背景圖一樣填滿，但保持比例 */
      }

      /* 玻璃擬物風格控制面板 */
      #ui-panel {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 16px;
        border: 1px rgba(255, 255, 255, 0.18);
        padding: 15px 20px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        transition: all 0.3s ease;
      }

      /* 手機橫擺時調整面板位置 */
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #ui-panel {
          bottom: auto;
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          width: 200px;
          padding: 10px;
        }
      }

      .status-container {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        width: 100%;
        justify-content: center;
      }

      /* 霓虹指示燈 */
      #status-led {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 10px;
        transition: background 0.3s ease, box-shadow 0.3s ease;
      }

      #status-text {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 0;
      }

      /* 狀態顏色定義 */
      .st-loading { 
        background-color: var(--loading-color); 
        box-shadow: 0 0 10px var(--loading-color); 
      }
      .st-safe { 
        background-color: var(--safe-color); 
        box-shadow: 0 0 10px var(--safe-color);
        color: var(--safe-color);
      }
      .st-alarm { 
        background-color: var(--alarm-color); 
        box-shadow: 0 0 15px var(--alarm-color);
        color: var(--alarm-color);
        animation: pulse 1.5s infinite;
      }

      #info-meta {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin: 0;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 5px var(--alarm-color); }
        50% { box-shadow: 0 0 20px var(--alarm-color); }
        100% { box-shadow: 0 0 5px var(--alarm-color); }
      }

    </style>
  </head>

  <body>
    <!-- HTML UI 面板 -->
    <div id="ui-panel">
      <div class="status-container">
        <div id="status-led" class="st-loading"></div>
        <p id="status-text">初始化中...</p>
      </div>
      <p id="info-meta">正在載入 AI 模型...</p>
    </div>

    <script>
      let video;
      let facemesh;
      let predictLabel = "載入中"; 
      let predictions = [];         
      let nn;                       
      let isLoadingModel = true;    
      let isPredicting = false;     

      // 原始影片的解析度，用於座標轉換計算
      let idealVidW = 640;
      let idealVidH = 480;

      // HTML DOM 元素
      let domLed, domText, domMeta;

      // ---------- p5.js setup ----------
      function setup() {
        // 建立全螢幕畫布
        createCanvas(windowWidth, windowHeight);
        
        // 取得 DOM 元素
        domLed = select('#status-led');
        domText = select('#status-text');
        domMeta = select('#info-meta');

        // 攝影機設定：針對手機優化，優先使用前鏡頭
        const constraints = {
          video: {
            facingMode: "user", // 優先前鏡頭
            width: { ideal: idealVidW },
            height: { ideal: idealVidH }
          },
          audio: false
        };

        video = createCapture(constraints, function(stream) {
          // 當影片流載入後，更新實際的影片尺寸 (手機旋轉時會變動)
          if (video.elt.videoWidth) {
            idealVidW = video.elt.videoWidth;
            idealVidH = video.elt.videoHeight;
            console.log(`攝影機實際尺寸: ${idealVidW}x${idealVidH}`);
          }
        });
        video.hide(); 

        // 初始化 ml5 神經網路
        const options = {
          inputs: 1044, // 348 點 * 3 (XYZ)
          outputs: 2,
          task: 'classification',
          debug: false
        };
        nn = ml5.neuralNetwork(options);

        // 載入 FaceMesh 模型
        facemesh = ml5.facemesh(video, faceModelReady);
      }

      // 視窗大小改變時，自動調整畫布
      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }

      // ---------- 模型的載入流程 ----------
      function faceModelReady() {
        console.log("FaceMesh 載入完成");
        facemesh.on("predict", gotFaceResult);
        uploadModel(); 
      }

      function uploadModel() {
        const modelInfo = {
          model: 'model.json',
          metadata: 'model_meta.json',
          weights: 'model.weights.bin',
        };
        // 檢查檔案是否存在，防止 404 報錯掛掉
        nn.load(modelInfo, modelLoaded);
      }

      function modelLoaded() {
        console.log("分類器模型載入完成");
        isLoadingModel = false;
        domMeta.html("AI 監控中...");
      }

      // ---------- 核心邏輯：特徵點處理與分類 ----------
      function gotFaceResult(faceResults) {
        predictions = faceResults;
        
        if (predictions.length > 0 && !isLoadingModel && !isPredicting) {
          predictData();
        }
      }

      function predictData() {
        // 整理輸入資料 (X,Y,Z 歸一化或原始，取決於你訓練時的格式)
        // 這裡預設你訓練時是用原始scaledMesh座標
        let inputData = [];
        if (predictions.length > 0 && predictions[0].scaledMesh) {
          const mesh = predictions[0].scaledMesh;
          for (let j = 0; j < mesh.length; j++) {
            inputData.push(mesh[j][0]); // X
            inputData.push(mesh[j][1]); // Y
            inputData.push(mesh[j][2]); // Z
          }
        }

        if (inputData.length === 1044) {
          isPredicting = true;
          nn.classify([inputData], gotResults);
        }
      }

      function gotResults(error, results) {
        isPredicting = false;

        if (error) {
          return;
        }

        if (results && results.length > 0) {
          predictLabel = results[0].label; // "打瞌睡" 或 "清醒"
        }
      }

      // ---------- p5.js 畫布繪製 (響應式繪圖核心) ----------
      function draw() {
        background(10); // 深色背景

        // 計算影片比例與畫布比例，進行 Letterbox (黑邊) 處理，確保影片不變形
        let imgW = video.width;
        let imgH = video.height;
        
        // 如果影片還沒載入，使用預設值
        if (imgW === 0) { imgW = idealVidW; imgH = idealVidH; }

        let s = min(width / imgW, height / imgH);
        let newW = imgW * s;
        let newH = imgH * s;
        let dx = (width - newW) / 2;
        let dy = (height - newH) / 2;

        push();
        translate(dx + newW, dy); // 移動到影片右上角以便翻轉
        scale(-1, 1); // 水平鏡像
        
        // 1. 繪製攝影機畫面
        image(video, 0, 0, newW, newH);

        // 2. 打瞌睡時疊加紅色濾鏡效果
        if (predictLabel === "打瞌睡") {
          push();
          fill(255, 0, 0, 80); // 半透明紅
          rect(0, 0, newW, newH);
          pop();
        }

        // 3. 繪製臉部關鍵點 (核心歸一化演算法)
        drawResponsiveKeypoints(newW, newH, imgW, imgH);
        pop(); 

        // 4. 更新 HTML UI 狀態 (不使用 p5 text，用 HTML 更美觀)
        updateUI();
      }

      // 關鍵函式：將 FaceMesh 座標轉換為當前畫布座標
      function drawResponsiveKeypoints(displayW, displayH, originalW, originalH) {
        if (predictions.length === 0) return;

        // 設定點的樣式
        if (predictLabel === "打瞌睡") {
          fill(255, 80, 80, 200); // 偏紅
          stroke(255, 255, 255, 150);
          strokeWeight(0.5);
        } else {
          fill(0, 230, 118, 200); // 霓虹綠
          noStroke();
        }

        const keypoints = predictions[0].scaledMesh;
        for (let j = 0; j < keypoints.length; j++) {
          // [0] = X, [1] = Y
          // 演算法：(原始座標 / 原始影片尺寸) * 當前繪製尺寸
          let ptX = (keypoints[j][0] / originalW) * displayW;
          let ptY = (keypoints[j][1] / originalH) * displayH;
          
          // 在手機上點不用太大
          let ptSize = map(displayW, 300, 1920, 1.5, 4);
          ellipse(ptX, ptY, ptSize, ptSize);
        }
      }

      // 更新 HTML 介面，不佔用 p5 資源且更美觀
      function updateUI() {
        // 先移除所有狀態 class
        domLed.removeClass('st-loading');
        domLed.removeClass('st-safe');
        domLed.removeClass('st-alarm');
        domText.removeClass('st-safe');
        domText.removeClass('st-alarm');

        if (isLoadingModel) {
          domLed.addClass('st-loading');
          domText.html("載入模型中...");
        } else {
          if (predictions.length === 0) {
            domLed.addClass('st-loading');
            domText.html("等待人臉...");
            domText.style('color', '#fff');
          } else {
            domText.html(predictLabel);
            if (predictLabel === "打瞌睡") {
              domLed.addClass('st-alarm');
              domText.addClass('st-alarm');
            } else {
              domLed.addClass('st-safe');
              domText.addClass('st-safe');
            }
          }
        }
      }
    </script>
  </body>
</html>
