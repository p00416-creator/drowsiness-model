<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 疲勞駕駛監控系統</title>
  
  <!-- 1. 載入 TensorFlow.js Core & WebGL & CPU 後端 (確保電腦與手機相容) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  
  <!-- 2. 載入 Google 官方 Face Landmarks Detection 模型 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  
  <!-- 3. 載入 p5.js, ml5.js 與 MQTT.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0 15px 0; }
    #canvas-container {
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
    }
    #webcam-video {
      display: none;
    }
  </style>
</head>
<body>

  <h2>🚨 疲勞駕駛 AI 偵測系統</h2>
  
  <div id="canvas-container"></div>
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    const gasUrl = "https://script.google.com/macros/s/你的_DEPLOYMENT_ID/exec";

    // --------- MQTT 設定 ---------
    let client;
    let connectMQTT = false;
    let mqttUsername = "we1688";
    let mqttPassword = "aio_QPfP05UOUn7pTKEh6Qjp9EIPQ9Mh";
    let mqttTopic = mqttUsername + "/feeds/alarm";

    let videoElement;
    let faceDetector;
    let keypointsList = []; 
    let predictLabel = "";
    let nn;
    
    let isCameraReady = false;
    let isFaceMeshReady = false;
    let isModelReady = false;

    let lastLabel = "";
    let videoSizeW = 640;
    let videoSizeH = 480;

    let userLat = "無";
    let userLng = "無";

    function updatePhoneLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude.toFixed(6);
            userLng = position.coords.longitude.toFixed(6);
            console.log(`📱 GPS 定位成功: ${userLat}, ${userLng}`);
          },
          (error) => console.warn("⚠️ 定位失敗: ", error.message),
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    }

    function sendToGAS(status) {
      if (!gasUrl || gasUrl.includes("你的_DEPLOYMENT_ID")) return;
      let payloadData = { status: status, lat: userLat, lng: userLng };
      fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payloadData)
      })
      .then(() => console.log(`✅ 狀態 [${status}] 已同步至 GAS！`))
      .catch(err => console.error("❌ 同步 GAS 失敗:", err));
    }

    function mqttSetup() {
      let mqttOptions = { username: mqttUsername, password: mqttPassword };
      client = mqtt.connect("wss://io.adafruit.com:443", mqttOptions);
      client.on("connect", () => {
        console.log("✅ 已連線 Adafruit IO MQTT！");
        connectMQTT = true;
      });
      client.on("error", (err) => console.error("❌ MQTT 錯誤:", err));
    }

    function getCurrentData() {
      let inputData = [];
      let count = Math.min(keypointsList.length, 348);
      for (let i = 0; i < count; i++) {
        inputData.push(keypointsList[i].x);
        inputData.push(keypointsList[i].y);
        inputData.push(keypointsList[i].z || 0);
      }
      while (inputData.length < 1044) {
        inputData.push(0);
      }
      return inputData;
    }

    function predictData() {
      if (isModelReady && keypointsList.length > 0) {
        let currentInputs = getCurrentData();
        if (currentInputs.length === 1044) {
          nn.classify([currentInputs], gotResults);
        }
      }
    }

    function checkStatus(){
      if(predictLabel !== lastLabel){
        console.log("🔄 狀態變更: " + predictLabel);
        if (predictLabel === "打瞌睡") updatePhoneLocation();
        
        sendToGAS(predictLabel);

        if (connectMQTT && client) {
          client.publish(mqttTopic, predictLabel);
          console.log("📡 發送 MQTT: " + predictLabel);
        }
      }
      lastLabel = predictLabel;
    }

    function gotResults(error, results) {
      if (!error && results && results.length > 0) {
        predictLabel = results[0].label;
        checkStatus();
      }
    }

    function uploadModel() {
      console.log("⏳ 下載 GitHub 自訂 AI 分類模型...");
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      nn.load(modelInfo, () => {
        console.log('✅ GitHub AI 分類模型讀取完成！');
        isModelReady = true;
      });
    }

    // 🎯 繪製綠色特徵點
    function drawKeypoints() {  
      if (keypointsList && keypointsList.length > 0) {
        push();
        fill(0, 255, 0); // 螢光綠
        noStroke();
        for (let i = 0; i < keypointsList.length; i++) {
          let pt = keypointsList[i];
          ellipse(pt.x, pt.y, 3, 3);
        }
        pop();
      }
    }

    // 🚀 高效能繪製與臉部檢測
    async function renderFaceMesh() {
      if (isCameraReady && faceDetector && videoElement.readyState >= 2) {
        try {
          const faces = await faceDetector.estimateFaces(videoElement, { flipHorizontal: false });
          if (faces.length > 0) {
            keypointsList = faces[0].keypoints;
            predictData();
          } else {
            keypointsList = [];
          }
        } catch (e) {
          console.warn("⚠️ 偵測遇障，嘗試重設畫面:", e);
        }
      }
      requestAnimationFrame(renderFaceMesh);
    }

    // 💻 硬體相容性診斷與初始化
    async function initCameraAndFaceMesh() {
      videoElement = document.getElementById('webcam-video');

      // 1. 強制設定 TensorFlow 後端渲染防線 (避免電腦 GPU 驅動崩潰)
      try {
        await tf.setBackend('webgl');
        console.log("⚡ 使用 WebGL 硬體加速");
      } catch (e) {
        console.warn("⚠️ 電腦 WebGL 初始化失敗，切換至 CPU 模式");
        await tf.setBackend('cpu');
      }

      // 2. 存取攝影機
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: videoSizeW, height: videoSizeH },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = async () => {
          console.log("📷 攝影機啟動成功！載入 FaceMesh 模型...");
          isCameraReady = true;

          const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
          const detectorConfig = {
            runtime: 'tfjs',
            refineLandmarks: false,
            maxFaces: 1
          };
          
          faceDetector = await faceLandmarksDetection.createDetector(model, detectorConfig);
          console.log("✅ FaceMesh 模型讀取完畢！");
          isFaceMeshReady = true;
          
          uploadModel(); 
          renderFaceMesh(); 
        };
      } catch (err) {
        console.error("❌ 無法取得攝影機權限: ", err);
        alert("⚠️ 請授權攝影機存取！");
      }
    }

    function setup() {
      let canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent('canvas-container');

      updatePhoneLocation();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);

      mqttSetup();
      initCameraAndFaceMesh();
    }

    function draw() {
      background(0);

      if (isCameraReady && videoElement) {
        drawingContext.drawImage(videoElement, 0, 0, videoSizeW, videoSizeH);
      }

      drawKeypoints();   
      
      textAlign(CENTER, CENTER);
      if (predictLabel === "打瞌睡") {
        fill(255, 50, 50);
        textSize(60);
        textStyle(BOLD);
        text("⚠️ 請保持清醒！", width / 2, height / 3);
      } else if (!isFaceMeshReady || !isModelReady) {
        fill(0, 0, 0, 180);
        rect(0, 0, width, height);
        
        fill(255, 255, 0);
        textSize(28);
        let msg = !isFaceMeshReady ? "⏳ FaceMesh 模型載入中..." : "⏳ AI 模型下載中...";
        text(msg, width / 2, height / 2);
      }
    }
  </script>
</body>
</html>
