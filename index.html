<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>駕駛疲勞偵測與緊急警報系統</title>
  
  <!-- p5.js & ml5.js 函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js" type="text/javascript"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #38bdf8;
      --alert-color: #ef4444;
      --safe-color: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent-color);
      letter-spacing: 1px;
      text-align: center;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    /* 儀表板區域 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .status-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .status-value.awake { color: var(--safe-color); }
    .status-value.drowsy { color: var(--alert-color); animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* 視訊 Canvas 容器 */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: #000;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    /* 系統日誌控制台 */
    .log-container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 140px;
      overflow-y: auto;
      color: var(--text-sub);
    }

    .log-item {
      margin-bottom: 4px;
    }

    .log-time {
      color: var(--accent-color);
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <h1 class="header-title">🚨 駕駛疲勞偵測與緊急警報系統</h1>

  <div class="main-container">
    <!-- 儀表板卡片 -->
    <div class="dashboard-grid">
      <div class="status-card">
        <span class="status-title">當前生理狀態</span>
        <span id="label-display" class="status-value awake">初始化中...</span>
      </div>
      <div class="status-card">
        <span class="status-title">GPS 定位狀態</span>
        <span id="gps-status" class="status-value" style="color: #f59e0b; font-size: 1rem;">定位中...</span>
      </div>
      <div class="status-card">
        <span class="status-title">GAS 雲端同步</span>
        <span id="gas-status" class="status-value" style="color: var(--accent-color);">待命</span>
      </div>
      <div class="status-card">
        <span class="status-title">AI 模型狀態</span>
        <span id="model-status" class="status-value" style="color: #f59e0b;">載入中...</span>
      </div>
    </div>

    <!-- p5 Canvas 畫布放置區 -->
    <div id="canvas-container" class="canvas-wrapper"></div>

    <!-- 即時日誌 -->
    <div class="log-container" id="log-box">
      <div class="log-item"><span class="log-time">[系統]</span> 啟動中，正在請求相機與 GPS 權限...</div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 前端系統設定
    // ==========================================
    // 請將下方 Replace 換成您發布的 GAS Web App 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec"; 

    let video;
    let facemesh;
    let predictLabel = "清醒";       // 當前預測結果
    let predictions = [];           // 人臉關鍵點
    let nn;                         // 神經網路
    let loading = true;             // 載入狀態
    let lastLabel = "";             // 上一次同步至 GAS 的狀態

    const videoSizeW = 640;
    const videoSizeH = 480;

    let isPredicting = false;       // 防重複推論鎖
    let drowsyCounter = 0;          // 打瞌睡連續幀數計數器
    const DROWSY_THRESHOLD = 3;     // 判定閾值：連續 3 幀才觸發警報

    // GPS 座標
    let currentLat = "無";
    let currentLng = "無";

    // 介面 Log 控制
    function addLog(msg) {
      const logBox = document.getElementById("log-box");
      const timeStr = new Date().toLocaleTimeString();
      const newLog = document.createElement("div");
      newLog.className = "log-item";
      newLog.innerHTML = `<span class="log-time">[${timeStr}]</span> ${msg}`;
      logBox.appendChild(newLog);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // ==========================================
    // 📍 取得瀏覽器 GPS 定位
    // ==========================================
    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude.toFixed(6);
            currentLng = position.coords.longitude.toFixed(6);
            document.getElementById("gps-status").innerText = `${currentLat}, ${currentLng}`;
            document.getElementById("gps-status").style.color = "var(--safe-color)";
          },
          (error) => {
            console.warn("GPS 定位失敗:", error.message);
            document.getElementById("gps-status").innerText = "無法定位";
            document.getElementById("gps-status").style.color = "var(--alert-color)";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        document.getElementById("gps-status").innerText = "不支援 GPS";
      }
    }

    // ==========================================
    // ☁️ 發送資料至 Google Apps Script (doPost)
    // ==========================================
    function sendToGAS(statusLabel) {
      if (!GAS_URL || GAS_URL.includes("YOUR_DEPLOYMENT_ID")) {
        document.getElementById("gas-status").innerText = "未設定網址";
        return;
      }

      document.getElementById("gas-status").innerText = "上傳中...";
      document.getElementById("gas-status").style.color = "#f59e0b";

      const payload = {
        status: statusLabel,
        lat: currentLat,
        lng: currentLng
      };

      // GAS 重定向需要 follow redirect，以 text/plain 可避免預檢請求問題
      fetch(GAS_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          document.getElementById("gas-status").innerText = "已同步";
          document.getElementById("gas-status").style.color = "var(--safe-color)";
          addLog(`雲端記錄成功 (${statusLabel}) ${statusLabel === '打瞌睡' ? '🚨 已觸發 LINE 警報' : ''}`);
        } else {
          throw new Error(data.message || "未知錯誤");
        }
      })
      .catch((err) => {
        document.getElementById("gas-status").innerText = "失敗";
        document.getElementById("gas-status").style.color = "var(--alert-color)";
        console.error("GAS 傳送失敗:", err);
        addLog(`❌ GAS 傳送失敗: ${err.message}`);
      });
    }

    // 檢查狀態變更
    function checkStatus() {
      if (predictLabel !== lastLabel) {
        sendToGAS(predictLabel);
        lastLabel = predictLabel;

        const labelDisplay = document.getElementById("label-display");
        labelDisplay.innerText = predictLabel;
        if (predictLabel === "打瞌睡") {
          labelDisplay.className = "status-value drowsy";
        } else {
          labelDisplay.className = "status-value awake";
        }
      }
    }

    // 轉換臉部節點資料 (348點 * 3維度 = 1044)
    function getCurrentData() {
      let inputData = [];
      if (predictions.length > 0 && predictions[0].scaledMesh) {
        const mesh = predictions[0].scaledMesh;
        for (let j = 0; j < mesh.length; j++) {
          for (let k = 0; k < mesh[j].length; k++) {
            inputData.push(mesh[j][k]);
          }
        }
      }
      return inputData;
    }

    // 神經網路預測
    function predictData() {
      if (isPredicting || predictions.length === 0) return;

      let inputData = getCurrentData();
      if (inputData.length === 1044) {
        isPredicting = true;
        nn.classify([inputData], gotResults);
      }
    }

    function gotResults(error, results) {
      isPredicting = false;
      if (error) {
        console.error("預測失敗:", error);
        return;
      }

      if (results && results.length > 0) {
        let rawLabel = results[0].label;

        // 防眨眼與瞬間晃動誤判
        if (rawLabel === "打瞌睡") {
          drowsyCounter++;
        } else {
          drowsyCounter = 0;
          predictLabel = "清醒";
        }

        if (drowsyCounter >= DROWSY_THRESHOLD) {
          predictLabel = "打瞌睡";
        }

        checkStatus();
      }
    }

    // 載入自訂分類模型
    function uploadModel() {
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      nn.load(modelInfo, modelLoaded);
    }

    function modelLoaded() {
      console.log("分類器模型載入完成");
      loading = false;
      document.getElementById("model-status").innerText = "就緒";
      document.getElementById("model-status").style.color = "var(--safe-color)";
      document.getElementById("label-display").innerText = "清醒";
      addLog("AI 模組已就緒，啟動即時駕駛防護監測");
    }

    function faceModelReady() {
      console.log("FaceMesh 模型讀取完畢");
      facemesh.on("predict", (results) => {
        predictions = results;
        if (predictions.length > 0) {
          predictData();
        }
      });
      uploadModel();
    }

    // ==========================================
    // 🎨 p5.js 主程式 (畫布繪製與鏡像校正)
    // ==========================================
    function setup() {
      const canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent("canvas-container");

      // 設置視訊鏡頭與行動裝置支援
      video = createCapture({
        audio: false,
        video: {
          width: { ideal: videoSizeW },
          height: { ideal: videoSizeH },
          facingMode: "user"
        }
      });
      video.size(videoSizeW, videoSizeH);
      video.hide();

      // 建立分類器模型
      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);

      // 啟動 FaceMesh & GPS
      facemesh = ml5.facemesh(video, faceModelReady);
      initGPS();
    }

    // 畫出鏡像校正後的特徵點 (防止特徵點與臉部反向)
    function drawKeypoints() {
      if (predictions.length === 0) return;

      push();
      translate(width, 0);
      scale(-1, 1);

      fill(56, 189, 248);
      noStroke();

      for (let i = 0; i < predictions.length; i++) {
        const keypoints = predictions[i].scaledMesh;
        for (let j = 0; j < keypoints.length; j++) {
          const [x, y] = keypoints[j];
          if (x >= 0 && x <= videoSizeW && y >= 0 && y <= videoSizeH) {
            ellipse(x, y, 3, 3);
          }
        }
      }
      pop();
    }

    // 繪製鏡像影像
    function drawMirroredVideo() {
      push();
      translate(width, 0);
      scale(-1, 1);
      image(video, 0, 0, width, height);
      pop();
    }

    function draw() {
      background(15, 23, 42);

      // 1. 繪製視訊影像
      drawMirroredVideo();

      // 2. 繪製臉部關鍵點
      drawKeypoints();

      // 3. 繪製狀態視覺提示與警報
      if (loading) {
        fill(0, 0, 0, 180);
        rect(0, 0, width, height);
        fill(255);
        textAlign(CENTER, CENTER);
        textSize(26);
        text("系統與 AI 模型載入中...", width / 2, height / 2);
      } else if (predictLabel === "打瞌睡") {
        // 警報紅色半透明遮罩
        fill(239, 68, 68, 80);
        rect(0, 0, width, height);

        fill(255);
        textAlign(CENTER, CENTER);
        textSize(48);
        textStyle(BOLD);
        text("⚠️ 警告：請保持清醒！", width / 2, height / 2);
      }
    }
  </script>
</body>
</html>
