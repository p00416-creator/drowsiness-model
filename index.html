<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 疲勞駕駛監控系統v6</title>
  
  <!-- 1. TensorFlow.js Core & Backend -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  
  <!-- 2. Google 官方 Face Landmarks Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  
  <!-- 3. p5.js, ml5.js & MQTT.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0 15px 0; }
    #canvas-container {
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
    }
    #webcam-video { display: none; }
  </style>
</head>
<body>

  <h2>🚨 疲勞駕駛 AI 偵測系統</h2>
  
  <div id="canvas-container"></div>
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbyGFrd3VqxAZ6vRGvWF-s4mzrSKas1gM0af09G6-_TXUEvJdNFUKYKM_jBDi8Eb1HHs/exec";

    // --------- MQTT 設定 ---------
    let client;
    let connectMQTT = false;
    let mqttUsername = "we1688";
    let mqttPassword = "aio_QPfP05UOUn7pTKEh6Qjp9EIPQ9Mh";
    let mqttTopic = mqttUsername + "/feeds/alarm";

    let videoElement;
    let faceDetector;
    let keypointsList = []; 
    let predictLabel = "等待 AI 推論中...";
    let confidenceVal = "0";
    let nn;
    
    let isCameraReady = false;
    let isFaceMeshReady = false;
    let isModelReady = false;

    let lastLabel = "";
    let videoSizeW = 640;
    let videoSizeH = 480;

    let userLat = "無";
    let userLng = "無";

    function updatePhoneLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude.toFixed(6);
            userLng = position.coords.longitude.toFixed(6);
            console.log(`📱 GPS 定位成功: ${userLat}, ${userLng}`);
          },
          (error) => console.warn("⚠️ 定位失敗: ", error.message),
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    }

    function sendToGAS(status) {
      if (!gasUrl || gasUrl.includes("你的_DEPLOYMENT_ID")) return;
      let payloadData = { status: status, lat: userLat, lng: userLng };
      fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payloadData)
      })
      .then(() => console.log(`✅ 狀態 [${status}] 已同步至 GAS！`))
      .catch(err => console.error("❌ 同步 GAS 失敗:", err));
    }

    function mqttSetup() {
      let mqttOptions = { username: mqttUsername, password: mqttPassword };
      client = mqtt.connect("wss://io.adafruit.com:443", mqttOptions);
      client.on("connect", () => {
        console.log("✅ 已連線 Adafruit IO MQTT！");
        connectMQTT = true;
      });
      client.on("error", (err) => console.error("❌ MQTT 錯誤:", err));
    }

    // 💡 關鍵修正：嚴格清洗特徵點數據為 1044 長度的純數字陣列
    function getCleanInputData() {
      let inputData = [];
      let count = Math.min(keypointsList.length, 348);
      for (let i = 0; i < count; i++) {
        let pt = keypointsList[i];
        inputData.push(Number(pt.x) || 0);
        inputData.push(Number(pt.y) || 0);
        inputData.push(Number(pt.z) || 0);
      }
      // 補齊至 1044 長度
      while (inputData.length < 1044) {
        inputData.push(0);
      }
      return inputData;
    }

    function predictData() {
      if (isModelReady && keypointsList.length > 0) {
        let inputs = getCleanInputData();
        // 直接傳入標準一維陣列
        nn.classify(inputs, gotResults);
      }
    }

    function checkStatus(){
      if(predictLabel !== lastLabel){
        console.log("🔄 狀態變更: " + predictLabel);
        if (predictLabel === "打瞌睡") updatePhoneLocation();
        
        sendToGAS(predictLabel);

        if (connectMQTT && client) {
          client.publish(mqttTopic, predictLabel);
          console.log("📡 發送 MQTT: " + predictLabel);
        }
      }
      lastLabel = predictLabel;
    }

    function gotResults(error, results) {
      if (error) {
        console.error("❌ 分類推論失敗:", error);
        return;
      }
      if (results && results.length > 0) {
        // 取得機率最高的標籤與信心值
        predictLabel = String(results[0].label).trim();
        confidenceVal = (results[0].confidence * 100).toFixed(0);
        checkStatus();
      }
    }

    function uploadModel() {
      console.log("⏳ 下載 GitHub 自訂 AI 分類模型...");
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      nn.load(modelInfo, () => {
        console.log('✅ GitHub AI 分類模型讀取完成！');
        isModelReady = true;
      });
    }

    function drawKeypoints() {  
      if (keypointsList && keypointsList.length > 0) {
        push();
        fill(0, 255, 0); 
        noStroke();
        for (let i = 0; i < keypointsList.length; i++) {
          let pt = keypointsList[i];
          ellipse(pt.x, pt.y, 3, 3);
        }
        pop();
      }
    }

    async function renderFaceMesh() {
      if (isCameraReady && faceDetector && videoElement.readyState >= 2) {
        try {
          const faces = await faceDetector.estimateFaces(videoElement, { flipHorizontal: false });
          if (faces.length > 0) {
            keypointsList = faces[0].keypoints;
            predictData();
          } else {
            keypointsList = [];
            predictLabel = "未偵測到人臉";
            confidenceVal = "0";
          }
        } catch (e) {
          console.warn("⚠️ 偵測遇障:", e);
        }
      }
      requestAnimationFrame(renderFaceMesh);
    }

    async function initCameraAndFaceMesh() {
      videoElement = document.getElementById('webcam-video');

      try {
        await tf.setBackend('webgl');
      } catch (e) {
        await tf.setBackend('cpu');
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: videoSizeW, height: videoSizeH },
          audio: false
        });
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = async () => {
          isCameraReady = true;

          const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
          const detectorConfig = {
            runtime: 'tfjs',
            refineLandmarks: false,
            maxFaces: 1
          };
          
          faceDetector = await faceLandmarksDetection.createDetector(model, detectorConfig);
          isFaceMeshReady = true;
          
          uploadModel(); 
          renderFaceMesh(); 
        };
      } catch (err) {
        alert("⚠️ 請授權攝影機存取！");
      }
    }

    function setup() {
      let canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent('canvas-container');

      updatePhoneLocation();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);

      mqttSetup();
      initCameraAndFaceMesh();
    }

    function draw() {
      background(0);

      // 1. 繪製攝影機畫面
      if (isCameraReady && videoElement) {
        drawingContext.drawImage(videoElement, 0, 0, videoSizeW, videoSizeH);
      }

      // 2. 繪製綠色網格
      drawKeypoints();   
      
      // 3. 頂部黑色條狀遮罩
      push();
      fill(0, 0, 0, 180);
      rect(0, 0, width, 70);
      pop();

      // 4. 文字顯示（無視狀態強制渲染）
      push();
      textAlign(CENTER, CENTER);

      if (!isFaceMeshReady || !isModelReady) {
        fill(255, 255, 0);
        textSize(22);
        let msg = !isFaceMeshReady ? "⏳ FaceMesh 模型載入中..." : "⏳ AI 模型下載中...";
        text(msg, width / 2, 35);
      } else if (predictLabel === "打瞌睡") {
        fill(255, 50, 50);
        textSize(30);
        textStyle(BOLD);
        text("⚠️ 警告：打瞌睡中！ (" + confidenceVal + "%)", width / 2, 35);
      } else {
        // 🟢 只要不是「打瞌睡」，無條件顯示當前標籤與信心度
        fill(0, 255, 127);
        textSize(28);
        textStyle(BOLD);
        text("🟢 狀態：" + predictLabel + " (" + confidenceVal + "%)", width / 2, 35);
      }
      pop();
    }
  </script>
</body>
</html>
