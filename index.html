<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 疲勞駕駛監控系統 (GAS 雲端版)16:37</title>
  
  <!-- TensorFlow.js Core & Backend -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  
  <!-- Google Face Landmarks Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  
  <!-- p5.js & ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { 
      margin: 8px 0; 
      font-size: 1.2rem; 
      text-align: center; 
      color: #e0e0e0;
    }
    #canvas-container {
      border: 2px solid #444;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webcam-video { display: none; }
  </style>
</head>
<body>

  <h2>🚨 AI 疲勞駕駛即時監控16:37</h2>
  
  <div id="canvas-container"></div>
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec";
  let video;
let facemesh;
let predictLabel = "清醒";       // 預測標籤（預設清醒）
let predictions = [];           // 臉部偵測節點資訊
let nn;                         // 神經網路
let loading = false;            // 載入狀態
let lastLabel;                  // 前一個發送的預測結果
let videoSizeW = 640;           // 影像寬度
let videoSizeH = 480;           // 影像高度
let labels = ['打瞌睡', '清醒'];

// --------- MQTT 資訊 ---------
let client;
let connectMQTT = false;
let mqttUsername = "we1688";
let mqttPassword = "aio_QPfP05UOUn7pTKEh6Qjp9EIPQ9Mh"; 
let mqttTopic = mqttUsername + "/feeds/alarm";

// --------- 效能與防誤判機制設定 ---------
let isPredicting = false;       // 神經網路推論鎖（防止請求堆疊）
let drowsyCounter = 0;          // 打瞌睡連續幀數計數器
const DROWSY_THRESHOLD = 1;     // 連續偵測到 N 次打瞌睡才觸發告警（防眨眼誤判）

// 取得目前的臉部特徵點資料
function getCurrentData() {
  let inputData = [];
  if (predictions.length > 0 && predictions[0].scaledMesh) {
    const mesh = predictions[0].scaledMesh;
    for (let j = 0; j < mesh.length; j++) {
      for (let k = 0; k < mesh[j].length; k++) {
        inputData.push(mesh[j][k]);
      }
    }
  }
  return inputData;
}

// 進行預測分類

// 進行預測分類
function predictData() {
  nn.classify([getCurrentData()], gotResults)
}


// 確認狀態
function checkStatus(){
  // 如果狀態變更
  if(predictLabel != lastLabel){
    // 傳送目前狀態
    client.publish(mqttTopic, predictLabel);
  }
  lastLabel = predictLabel;
}


// 取得結果 + 確認狀態
function gotResults(error, results) {
  if (error) {
    console.log('發生錯誤')
  }
  else{
    predictLabel = results[0].label;
    console.log("預測結果：" + predictLabel);
    checkStatus();    // 確認狀態
  }
}


// ---------- 上傳模型 ----------
function uploadModel() {
  const modelInfo = {
    model: 'model/model.json',
    metadata: 'model/model_meta.json',
    weights: 'model/model.weights.bin',
  };
  nn.load(modelInfo, modelLoaded);
  loading = true;
}

function modelLoaded() {
  console.log("分類器模型載入完成");
  loading = false;
}

// 繪製臉部特徵點
function drawKeypoints() {
  if (predictions.length === 0) return;

  fill(100, 255, 100);
  noStroke();
  
  for (let i = 0; i < predictions.length; i++) {
    const keypoints = predictions[i].scaledMesh;
    for (let j = 0; j < keypoints.length; j++) {
      const [x, y] = keypoints[j];
      if (x >= 0 && x <= videoSizeW && y >= 0 && y <= videoSizeH) {
        ellipse(x, y, 3, 3);
      }
    }
  }
}

function faceModelReady() {
  console.log("FaceMesh 模型讀取完畢");
  facemesh.on("predict", gotFaceResult);
  loading = false;
  uploadModel(); 
}

function gotFaceResult(faceResults) {
  predictions = faceResults;
  if (predictions.length > 0) {
    predictData();
  }
}

// ---------- MQTT 設定 ----------
function mqttSetup() {
  let mqttOptions = {
    username: mqttUsername, // 使用者名稱
    password: mqttPassword, // 金鑰
  };
  client = mqtt.connect("wss://io.adafruit.com:443", mqttOptions);
  console.log("連線 MQTT 伺服器中...");
  client.on("connect", mqttConnected);
}

function mqttConnected() {
  console.log("已連線 MQTT 伺服器");
  connectMQTT = true; // 已連接 MQTT 伺服器
}

// ---------- p5.js 主程序 ----------
function setup() {
  // 修復原本 height * 2 導致畫面下方過大的問題
  createCanvas(videoSizeW, videoSizeH);
  
  video = createCapture(VIDEO);
  video.size(videoSizeW, videoSizeH);
  video.hide(); 

  const options = {
    inputs: 1044,
    outputs: 2,
    task: 'classification',
    debug: false // 訓練完成後可設為 false 提升效能
  };
  nn = ml5.neuralNetwork(options);

  loading = true;
  facemesh = ml5.facemesh(video, faceModelReady);

  mqttSetup();
}

function draw() {

  image(video, 0, 0, videoSizeW, videoSizeH);
   
  // 在臉部偵測關鍵點畫上圓形
  drawKeypoints();   
  
  // 瞌睡警報更改畫面色調
  textAlign(CENTER, CENTER);
  if (predictLabel == "打瞌睡") {
    fill(255, 255, 255);
    textSize(72);
    text("請保持清醒！", width / 2, height / 3)
    tint(255, 20, 150);
  } 
  // 模型讀取中
  else if (loading){
    fill(255, 255, 255);
    textSize(48);
    text("讀取中...", width / 2, height / 3)
    tint(100, 100, 100);    
  }  else {
    tint(255);    
  } 
}
  </script>
</body>
</html>
