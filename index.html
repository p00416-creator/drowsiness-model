<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Nod off Alarm - 瞌睡警報器</title>
    <!-- p5.js 與 ml5.js 套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js" type="text/javascript"></script>

    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #222;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      canvas {
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>

  <body>
    <script>
      let video;
      let facemesh;
      let predictLabel = "清醒";       // 當前顯示狀態
      let predictions = [];            // 臉部特徵點資料
      let nn;                          // 分類神經網路
      let loading = true;              // 載入狀態

      let videoSizeW = 640;            // 畫面寬度
      let videoSizeH = 480;            // 畫面高度

      // --------- 效能與觸發機制設定 ---------
      let isPredicting = false;        // 推論狀態鎖（防止 CPU 請求堆疊卡頓）
      let drowsyCounter = 0;          // 打瞌睡連續計數器
      const DROWSY_THRESHOLD = 1;      // 設定為 1 次，即刻觸發

      // ---------- p5.js setup ----------
      function setup() {
        createCanvas(videoSizeW, videoSizeH);
        
        // 載入攝影機
        video = createCapture(VIDEO);
        video.size(videoSizeW, videoSizeH);
        video.hide(); 

        // 初始化神經網路
        const options = {
          inputs: 1044,
          outputs: 2,
          task: 'classification',
          debug: false
        };
        nn = ml5.neuralNetwork(options);

        // 載入 FaceMesh 模型
        facemesh = ml5.facemesh(video, faceModelReady);
      }

      // ---------- 模型的載入流程 ----------
      function faceModelReady() {
        console.log("FaceMesh 模型載入完成");
        facemesh.on("predict", gotFaceResult);
        uploadModel(); 
      }

      function uploadModel() {
        const modelInfo = {
          model: 'model.json',
          metadata: 'model_meta.json',
          weights: 'model.weights.bin',
        };
        nn.load(modelInfo, modelLoaded);
      }

      function modelLoaded() {
        console.log("分類器模型載入完成");
        loading = false;
      }

      // ---------- 特徵點處理與分類 ----------
      function getCurrentData() {
        let inputData = [];
        if (predictions.length > 0 && predictions[0].scaledMesh) {
          const mesh = predictions[0].scaledMesh;
          for (let j = 0; j < mesh.length; j++) {
            inputData.push(mesh[j][0]); // X
            inputData.push(mesh[j][1]); // Y
            inputData.push(mesh[j][2]); // Z
          }
        }
        return inputData;
      }

      function gotFaceResult(faceResults) {
        predictions = faceResults;
        
        // 防堆疊鎖：如果上一幀仍在推論中，則跳過此幀
        if (predictions.length > 0 && !loading && !isPredicting) {
          predictData();
        }
      }

      function predictData() {
        const inputData = getCurrentData();
        if (inputData.length > 0) {
          isPredicting = true; // 上鎖
          nn.classify([inputData], gotResults);
        }
      }

      function gotResults(error, results) {
        isPredicting = false; // 解鎖

        if (error) {
          console.error("分類錯誤:", error);
          return;
        }

        if (results && results.length > 0) {
          let rawLabel = results[0].label;

          // 判定機制（1 次即判定觸發）
          if (rawLabel === "打瞌睡") {
            drowsyCounter++;
            if (drowsyCounter >= DROWSY_THRESHOLD) {
              predictLabel = "打瞌睡";
            }
          } else {
            drowsyCounter = 0; // 重置計數器
            predictLabel = "清醒";
          }
        }
      }

      // ---------- p5.js 畫布繪製 ----------
      function draw() {
        background(0);

        // 水平鏡像處理（符合看鏡頭的習慣）
        push();
        translate(width, 0);
        scale(-1, 1);
        
        // 1. 繪製攝影機畫面
        image(video, 0, 0, videoSizeW, videoSizeH);

        // 2. 瞌睡警報色調疊加
        if (predictLabel === "打瞌睡") {
          tint(255, 50, 50); // 紅色警示濾鏡
        } else {
          noTint();
        }

        // 3. 繪製臉部關鍵點
        drawKeypoints();
        pop(); // 恢復座標系，避免文字也被翻轉

        // 4. 繪製 UI 文字提示
        textAlign(CENTER, CENTER);
        
        if (loading) {
          fill(255, 200, 0);
          textSize(36);
          text("模型讀取中，請稍候...", width / 2, height / 2);
        } else if (predictLabel === "打瞌睡") {
          fill(255, 50, 50);
          textSize(64);
          textStyle(BOLD);
          text("⚠️ 請保持清醒！", width / 2, height / 3);
        } else {
          fill(0, 255, 127);
          textSize(28);
          textStyle(NORMAL);
          text("狀態：精神飽滿", width / 2, 40);
        }
      }

      function drawKeypoints() {
        if (predictions.length === 0) return;

        fill(100, 255, 100);
        noStroke();

        const keypoints = predictions[0].scaledMesh;
        for (let j = 0; j < keypoints.length; j++) {
          const [x, y] = keypoints[j];
          if (x >= 0 && x <= videoSizeW && y >= 0 && y <= videoSizeH) {
            ellipse(x, y, 3, 3);
          }
        }
      }
    </script>
  </body>
</html>
