<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 疲勞駕駛監控系統 (GAS 雲端版)16:42</title>
  
  <!-- TensorFlow.js Core & Backend -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  
  <!-- Google Face Landmarks Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  
  <!-- p5.js & ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { 
      margin: 8px 0; 
      font-size: 1.2rem; 
      text-align: center; 
      color: #e0e0e0;
    }
    #canvas-container {
      border: 2px solid #444;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webcam-video { display: none; }
  </style>
</head>
<body>

  <h2>🚨 AI 疲勞駕駛即時監控16:42</h2>
  
  <div id="canvas-container"></div>
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec";

    let videoElement;
    let faceDetector;
    let keypointsList = []; 
    let predictLabel = "清醒";
    let confidenceVal = "0";
    let nn;
    
    let isCameraReady = false;
    let isFaceMeshReady = false;
    let isModelReady = false;
    let isPredicting = false;

    let lastLabel = "";
    let videoSizeW = 640;
    let videoSizeH = 480;

    let userLat = "無";
    let userLng = "無";

    // 🎯 防抖動與請求節流機制
    let pendingLabel = "";
    let labelCount = 0;
    const CONFIRM_THRESHOLD = 1; 
    let lastGasSendTime = 0;
    const GAS_COOLDOWN_MS = 3000; // 同樣狀態發送冷卻時間：3秒

    // 🔊 Web Audio API 蜂鳴警報器
    let audioCtx = null;
    let alarmInterval = null;

    function playAlarmSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state == 'suspended') {
        audioCtx.resume();
      }

      if (!alarmInterval) {
        alarmInterval = setInterval(() => {
          if (predictLabel == "打瞌睡") {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz (A5 高音警示)
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          } else {
            clearInterval(alarmInterval);
            alarmInterval = null;
          }
        }, 400);
      }
    }

    function updatePhoneLocation(callback) {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude.toFixed(6);
            userLng = position.coords.longitude.toFixed(6);
            console.log(`📱 GPS 定位成功: ${userLat}, ${userLng}`);
            if (callback) callback();
          },
          (error) => {
            console.warn("⚠️ 高精度定位失敗，切換低精度備用...", error.message);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                userLat = pos.coords.latitude.toFixed(6);
                userLng = pos.coords.longitude.toFixed(6);
                if (callback) callback();
              },
              (err2) => {
                console.error("❌ GPS 定位無回應:", err2.message);
                if (callback) callback();
              },
              { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
            );
          },
          { enableHighAccuracy: true, timeout: 4000, maximumAge: 10000 }
        );
      } else {
        if (callback) callback();
      }
    }

    function sendToGAS(status) {
      if (!gasUrl || gasUrl.includes("你的_DEPLOYMENT_ID")) return;

      const now = Date.now();
      if (now - lastGasSendTime < GAS_COOLDOWN_MS && status == lastLabel) {
        return; // 防暴衝節流
      }
      lastGasSendTime = now;
      
      if (userLat == "無") {
        updatePhoneLocation(() => executeGASPost(status));
      } else {
        executeGASPost(status);
      }
    }

    function executeGASPost(status) {
      let payloadData = { status: status, lat: userLat, lng: userLng };
      fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payloadData)
      })
      .then(() => console.log(`✅ 狀態 [${status}] 已傳送至 GAS (GPS: ${userLat}, ${userLng})`))
      .catch(err => console.error("❌ GAS 傳送失敗:", err));
    }

// 取得目前的臉部特徵點資料
function getCurrentData() {
  let inputData = [];
  if (predictions.length > 0 && predictions[0].scaledMesh) {
    const mesh = predictions[0].scaledMesh;
    for (let j = 0; j < mesh.length; j++) {
      for (let k = 0; k < mesh[j].length; k++) {
        inputData.push(mesh[j][k]);
      }
    }
  }
  return inputData;
}

// 進行預測分類

// 進行預測分類
function predictData() {
  nn.classify([getCurrentData()], gotResults)
}

// 確認狀態
function checkStatus(){
  // 如果狀態變更
  if(predictLabel != lastLabel){
     console.log("🔄 狀態確認變更: " + predictLabel);         
          lastLabel = predictLabel;
    // 觸發蜂鳴警報
        if (predictLabel == "打瞌睡") {
          playAlarmSound();
          sendToGAS(predictLabel);
        }       
  }
}
  
// 取得結果 + 確認狀態
function gotResults(error, results) {
  if (error) {
    console.log('發生錯誤')
  }
  else{
    predictLabel = results[0].label;
    console.log("預測結果：" + predictLabel);
    checkStatus();    // 確認狀態
  }
}

function uploadModel() {
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      
      nn.load(modelInfo, () => {
        console.log('✅ AI 分類模型載入完成');
        isModelReady = true;
      });
    }

    // 繪製特徵點（含水平鏡像對應）
    function drawKeypoints() {  
      if (keypointsList && keypointsList.length > 0) {
        push();
        fill(0, 255, 150); 
        noStroke();
        for (let i = 0; i < keypointsList.length; i++) {
          let pt = keypointsList[i];
          // 鏡像翻轉 X 座標
          let mirrorX = width - pt.x;
          ellipse(mirrorX, pt.y, 3, 3);
        }
        pop();
      }
    }

    async function renderFaceMesh() {
      // 若頁面不在前景則暫停偵測以節省效能
      if (document.hidden) {
        setTimeout(renderFaceMesh, 200);
        return;
      }

      if (isCameraReady && faceDetector && videoElement.readyState >= 2) {
        try {
          const faces = await faceDetector.estimateFaces(videoElement, { flipHorizontal: false });
          
          if (faces && faces.length > 0) {
            keypointsList = faces[0].keypoints || [];
            if (keypointsList.length > 0) {
              predictData();
            }
          } else {
            keypointsList = [];
            confidenceVal = "0";
           // checkStatus("未偵測到人臉");
            predictLabel="未偵測到人臉";
          }
        } catch (e) {
          console.warn("⚠️ FaceMesh 畫面解析異常:", e);
        }
      }
      requestAnimationFrame(renderFaceMesh);
    }

    async function initCameraAndFaceMesh() {
      videoElement = document.getElementById('webcam-video');

      try {
        await tf.setBackend('webgl');
      } catch (e) {
        await tf.setBackend('cpu');
      }

      try {
        const constraints = {
          video: {
            facingMode: "user",
            width: { ideal: videoSizeW },
            height: { ideal: videoSizeH },
            frameRate: { ideal: 30 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = async () => {
          isCameraReady = true;

          const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
          const detectorConfig = {
            runtime: 'tfjs',
            refineLandmarks: false,
            maxFaces: 1
          };
          
          faceDetector = await faceLandmarksDetection.createDetector(model, detectorConfig);
          isFaceMeshReady = true;
          
          uploadModel(); 
          renderFaceMesh(); 
        };
      } catch (err) {
        alert("⚠️ 無法存取攝影機，請檢查權限與 HTTPS 連線設定！");
      }
    }

    function setup() {
      // 📱 動態計算 RWD 適應螢幕尺寸
      let calcW = Math.min(windowWidth - 20, 640);
      let calcH = Math.round(calcW * (480 / 640));
      videoSizeW = calcW;
      videoSizeH = calcH;

      let canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent('canvas-container');

      // 點擊畫面啟用 AudioContext（瀏覽器聲音安全政策）
      canvas.mousePressed(() => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      });

      updatePhoneLocation();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      
      nn = ml5.neuralNetwork(options);
      initCameraAndFaceMesh();
    }

    function windowResized() {
      let calcW = Math.min(windowWidth - 20, 640);
      let calcH = Math.round(calcW * (480 / 640));
      resizeCanvas(calcW, calcH);
    }

    function draw() {
      background(15);

      // 1. 繪製攝影機畫面（水平鏡像翻轉，如同後照鏡）
      if (isCameraReady && videoElement) {
        push();
        translate(width, 0);
        scale(-1, 1);
        drawingContext.drawImage(videoElement, 0, 0, width, height);
        pop();
      }

      // 2. 繪製網格特徵點
      drawKeypoints();   
      
      // 3. 頂部狀態列背景遮罩
      push();
      fill(0, 0, 0, 190);
      rect(0, 0, width, 60);
      pop();

      // 4. 文字狀態顯示
      push();
      textAlign(CENTER, CENTER);

      if (!isFaceMeshReady || !isModelReady) {
        fill(255, 200, 0);
        textSize(18);
        let msg = !isFaceMeshReady ? "⏳ 臉部模型初始化中..." : "⏳ AI 分類模型下載中...";
        text(msg, width / 2, 30);
      } else if (predictLabel == "打瞌睡") {
        fill(255, 60, 60);
        textSize(24);
        textStyle(BOLD);
        text("🚨 警告：偵測到打瞌睡 (" + confidenceVal + "%)", width / 2, 30);
      } else if (predictLabel == "未偵測到人臉") {
        fill(180, 180, 180);
        textSize(20);
        text("👤 請將臉部對準鏡頭", width / 2, 30);
      } /*else if (predictLabel == "載入中...") {
        fill(255, 220, 0);
        textSize(18);
        text("⏳ AI 分析推論中...", width / 2, 30);
      } */else {
        fill(50, 230, 120);
        textSize(22);
        textStyle(BOLD);
        text("🟢 狀態：" + predictLabel + " (" + confidenceVal + "%)", width / 2, 30);
      }
      pop();
    }
  </script>
</body>
</html>
