<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI駕駛與專注力打瞌睡即時偵1312</title>
    <!-- 只需載入 p5.js，dom 模組已內建於現代版本中 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js" type="text/javascript"></script>

    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 10px;
        margin: 0;
      }

      header { text-align: center; margin-bottom: 20px; }
      header h1 { font-size: 1.8rem; color: var(--accent-color); }

      .main-container {
        width: 100%;
        max-width: 680px;
        background: var(--card-bg);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      canvas {
        width: 100% !important;
        height: auto !important;
        max-width: 640px;
        border-radius: 12px;
        display: block;
        /* 已經移除鏡像 transform，呈現原始畫面 */
      }
    </style>
  </head>

  <body>
    <header>
      <h1>AI駕駛打瞌睡即時偵測系統1312</h1>
    </header>

    <div class="main-container" id="canvas-container">
      <!-- p5.js Canvas 會自動插入至此 -->
    </div>

    <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec";
    
    let currentLat = "無", currentLng = "無";
    let video, facemesh, nn;
    let predictLabel = "清醒", rawLabel = "清醒", lastLabel = "清醒";
    let predictions = [];
    let loading = true;
    
    let videoSizeW = 640;
    let videoSizeH = 480;

    // 防誤判機制
    let drowsyCounter = 0;
    const DROWSY_THRESHOLD = 5;

    function initGeolocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
          },
          (err) => console.log("GPS 錯誤: ", err.message),
          { enableHighAccuracy: true }
        );
      }
    }

    function sendToGAS(status) {
      if (!GAS_URL) return;
      const payload = { status: status, lat: currentLat, lng: currentLng };

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(() => console.log(`🚀 已發送狀態: ${status}`));
    }

    function getCurrentData() {
      let inputData = [];
      if (predictions.length > 0 && predictions[0].scaledMesh) {
        const mesh = predictions[0].scaledMesh;
        for (let j = 0; j < mesh.length; j++) {
          for (let k = 0; k < mesh[j].length; k++) {
            inputData.push(mesh[j][k]);
          }
        }
      }
      return inputData;
    }

    function predictData() {
      if(nn && !loading) {
        nn.classify([getCurrentData()], gotResults);
      }
    }

    function gotResults(error, results) {
      if (error) return;
      rawLabel = results[0].label;
      
      if (rawLabel === "打瞌睡") {
        drowsyCounter++;
        if (drowsyCounter >= DROWSY_THRESHOLD) {
          predictLabel = "打瞌睡";
          sendToGAS(predictLabel);
        }
      } else {
        drowsyCounter = 0;
        predictLabel = "清醒";
      }

      if (predictLabel !== lastLabel) {
        lastLabel = predictLabel;
      }
    }

    function faceModelReady() {
      console.log("FaceMesh 準備完畢");
      facemesh.on("predict", results => {
        predictions = results;
        predictData();
      });
      uploadModel(); 
    }

    function uploadModel() {
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      nn.load(modelInfo, () => {
        console.log("神經網路載入完成");
        loading = false;
      });
    }

    function setup() {
      let cnv = createCanvas(videoSizeW, videoSizeH);
      cnv.parent('canvas-container');
      
      video = createCapture(VIDEO);
      video.size(videoSizeW, videoSizeH);
      video.hide(); 

      initGeolocation();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);
      facemesh = ml5.facemesh(video, faceModelReady);
    }

    function draw() {
      image(video, 0, 0, videoSizeW, videoSizeH);
      
      // 繪製臉部網格
      if (predictions.length > 0) {
        fill(100, 255, 100);
        noStroke();
        
        // 1. 計算手機或攝影機實際畫面的縮放比例 (解決在不同裝置上擠壓變形的問題)
        let vW = video.elt.videoWidth || videoSizeW;
        let vH = video.elt.videoHeight || videoSizeH;
        let scaleX = width / vW;
        let scaleY = height / vH;

        let keypoints = predictions[0].scaledMesh;
        for (let i = 0; i < keypoints.length; i++) {
          let [x, y] = keypoints[i];
          
          // 2. 依照實際比例縮放座標
          x = x * scaleX;
          y = y * scaleY;
          
          // 3. 校正 X 軸鏡像偏移 (將特徵點水平翻轉，以對齊未鏡像的視訊畫面)
          x = width - x;
          
          // 確保座標在畫面範圍內才繪製
          if (x >= 0 && x <= width && y >= 0 && y <= height) {
            ellipse(x, y, 3, 3);
          }
        }
      }
      
      textAlign(CENTER, CENTER);
      if (loading) {
        fill(255);
        textSize(48);
        text("讀取模型中...", width / 2, height / 3);
        tint(100, 100, 100);    
      } else if (predictLabel === "打瞌睡") {
        fill(255);
        textSize(72);
        text("請保持清醒！", width / 2, height / 3);
        tint(255, 20, 150); // 變更全螢幕色調警告
      } else {
        tint(255);
      }
    }
    </script>
  </body>
</html>
