<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 疲勞駕駛監控系統 (GAS 雲端版)13:30</title>
  
  <!-- TensorFlow.js Core & Backend -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  
  <!-- Google Face Landmarks Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  
  <!-- p5.js & ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0 15px 0; font-size: 1.4rem; text-align: center; }
    #canvas-container {
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
      max-width: 100%;
    }
    #webcam-video { display: none; }
  </style>
</head>
<body>

  <h2>🚨 疲勞駕駛 AI 偵測系統</h2>
  
  <div id="canvas-container"></div>
  <video id="webcam-video" width="640" height="480" autoplay playsinline muted></video>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec";

    let videoElement;
    let faceDetector;
    let keypointsList = []; 
    let predictLabel = "載入中...";
    let confidenceVal = "0";
    let nn;
    
    let isCameraReady = false;
    let isFaceMeshReady = false;
    let isModelReady = false;
    let isPredicting = false;

    let lastLabel = "";
    let videoSizeW = 640;
    let videoSizeH = 480;

    let userLat = "無";
    let userLng = "無";

    // 🎯 防抖動與連續狀態確認機制
    let pendingLabel = "";
    let labelCount = 0;
    const CONFIRM_THRESHOLD = 3; // 連續 3 幀相同判斷才確認更新，防止跳針

    function updatePhoneLocation(callback) {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude.toFixed(6);
            userLng = position.coords.longitude.toFixed(6);
            console.log(`📱 GPS 定位成功: ${userLat}, ${userLng}`);
            if (callback) callback();
          },
          (error) => {
            console.warn("⚠️ 第一次定位失敗，嘗試低精度備用定位...", error.message);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                userLat = pos.coords.latitude.toFixed(6);
                userLng = pos.coords.longitude.toFixed(6);
                console.log(`📱 備用 GPS 定位成功: ${userLat}, ${userLng}`);
                if (callback) callback();
              },
              (err2) => {
                console.error("❌ GPS 定位徹底失敗:", err2.message);
                if (err2.code === err2.PERMISSION_DENIED) {
                  alert("⚠️ 系統無法取得 GPS 定位：請至手機設定中允許瀏覽器存取「位置資訊」。");
                }
                if (callback) callback();
              },
              { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
            );
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        console.error("❌ 你的瀏覽器不支援 Geolocation 定位功能");
        if (callback) callback();
      }
    }

    function sendToGAS(status) {
      if (!gasUrl || gasUrl.includes("你的_DEPLOYMENT_ID")) return;
      
      if (userLat === "無") {
        updatePhoneLocation(() => {
          executeGASPost(status);
        });
      } else {
        executeGASPost(status);
      }
    }

    function executeGASPost(status) {
      let payloadData = { status: status, lat: userLat, lng: userLng };
      fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payloadData)
      })
      .then(() => console.log(`✅ 狀態 [${status}] 已同步至 GAS！ (GPS: ${userLat}, ${userLng})`))
      .catch(err => console.error("❌ 同步 GAS 失敗:", err));
    }

    // 將特徵點數據嚴格清洗並轉換為 1044 長度陣列
    function getCleanInputData() {
      let inputData = [];
      let count = Math.min(keypointsList.length, 348);
      
      for (let i = 0; i < count; i++) {
        let pt = keypointsList[i];
        let x = (pt && typeof pt.x === 'number' && !isNaN(pt.x)) ? pt.x : 0;
        let y = (pt && typeof pt.y === 'number' && !isNaN(pt.y)) ? pt.y : 0;
        let z = (pt && typeof pt.z === 'number' && !isNaN(pt.z)) ? pt.z : 0;
        
        inputData.push(x);
        inputData.push(y);
        inputData.push(z);
      }
      
      while (inputData.length < 1044) {
        inputData.push(0);
      }
      return inputData;
    }

    function predictData() {
      if (isModelReady && keypointsList.length > 0 && !isPredicting) {
        isPredicting = true;
        let inputs = getCleanInputData();
        
        try {
          nn.classify(inputs, gotResults);
        } catch (err) {
          console.error("❌ 推論觸發失敗:", err);
          isPredicting = false;
        }
      }
    }

    function checkStatus(rawLabel){
      // 防抖動連續幀確認機制
      if (rawLabel === pendingLabel) {
        labelCount++;
      } else {
        pendingLabel = rawLabel;
        labelCount = 1;
      }

      if (labelCount >= CONFIRM_THRESHOLD) {
        predictLabel = pendingLabel;
        if(predictLabel !== lastLabel && predictLabel !== "載入中..."){
          console.log("🔄 狀態確認變更: " + predictLabel);
          sendToGAS(predictLabel);
          lastLabel = predictLabel;
        }
      }
    }

    function gotResults(error, results) {
      isPredicting = false;
      
      if (error) {
        console.error("❌ ml5 推論過程報錯:", error);
        return;
      }
      
      if (results && results.length > 0) {
        let currentLabel = String(results[0].label).trim();
        confidenceVal = (results[0].confidence * 100).toFixed(0);
        checkStatus(currentLabel);
      }
    }

    function uploadModel() {
      console.log("⏳ 開始下載並載入 AI 分類模型檔...");
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      
      nn.load(modelInfo, () => {
        console.log('✅ AI 分類模型已成功載入！');
        isModelReady = true;
      });
    }

    function drawKeypoints() {  
      if (keypointsList && keypointsList.length > 0) {
        push();
        fill(0, 255, 0); 
        noStroke();
        for (let i = 0; i < keypointsList.length; i++) {
          let pt = keypointsList[i];
          ellipse(pt.x, pt.y, 3, 3);
        }
        pop();
      }
    }

    async function renderFaceMesh() {
      if (isCameraReady && faceDetector && videoElement.readyState >= 2) {
        try {
          const faces = await faceDetector.estimateFaces(videoElement, { flipHorizontal: false });
          
          if (faces && faces.length > 0) {
            keypointsList = faces[0].keypoints || [];
            if (keypointsList.length > 0) {
              predictData();
            }
          } else {
            keypointsList = [];
            confidenceVal = "0";
            checkStatus("未偵測到人臉");
          }
        } catch (e) {
          console.warn("⚠️ FaceMesh 偵測遇障:", e);
        }
      }
      requestAnimationFrame(renderFaceMesh);
    }

    async function initCameraAndFaceMesh() {
      videoElement = document.getElementById('webcam-video');

      try {
        await tf.setBackend('webgl');
      } catch (e) {
        await tf.setBackend('cpu');
      }

      try {
        // 優化行動裝置前鏡頭設定與張數限制
        const constraints = {
          video: {
            facingMode: "user",
            width: { ideal: videoSizeW },
            height: { ideal: videoSizeH },
            frameRate: { ideal: 30, max: 60 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        
        videoElement.onloadedmetadata = async () => {
          isCameraReady = true;

          const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
          const detectorConfig = {
            runtime: 'tfjs',
            refineLandmarks: false,
            maxFaces: 1
          };
          
          faceDetector = await faceLandmarksDetection.createDetector(model, detectorConfig);
          isFaceMeshReady = true;
          
          uploadModel(); 
          renderFaceMesh(); 
        };
      } catch (err) {
        alert("⚠️ 請授權攝影機存取！");
      }
    }

    function setup() {
      let canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent('canvas-container');

      updatePhoneLocation();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      
      nn = ml5.neuralNetwork(options);
      initCameraAndFaceMesh();
    }

    function draw() {
      background(0);

      // 1. 繪製攝影機畫面
      if (isCameraReady && videoElement) {
        drawingContext.drawImage(videoElement, 0, 0, videoSizeW, videoSizeH);
      }

      // 2. 繪製綠色網格
      drawKeypoints();   
      
      // 3. 頂部遮罩
      push();
      fill(0, 0, 0, 180);
      rect(0, 0, width, 70);
      pop();

      // 4. 文字狀態顯示
      push();
      textAlign(CENTER, CENTER);

      if (!isFaceMeshReady || !isModelReady) {
        fill(255, 255, 0);
        textSize(22);
        let msg = !isFaceMeshReady ? "⏳ FaceMesh 模型載入中..." : "⏳ AI 分類模型下載中...";
        text(msg, width / 2, 35);
      } else if (predictLabel === "打瞌睡") {
        fill(255, 50, 50);
        textSize(30);
        textStyle(BOLD);
        text("⚠️ 警告：打瞌睡中！ (" + confidenceVal + "%)", width / 2, 35);
      } else if (predictLabel === "未偵測到人臉") {
        fill(200, 200, 200);
        textSize(26);
        text("👤 請將臉部對準鏡頭", width / 2, 35);
      } else if (predictLabel === "載入中...") {
        fill(255, 255, 0);
        textSize(22);
        text("⏳ AI 分析推論中...", width / 2, 35);
      } else {
        fill(0, 255, 127);
        textSize(28);
        textStyle(BOLD);
        text("🟢 狀態：" + predictLabel + " (" + confidenceVal + "%)", width / 2, 35);
      }
      pop();
    }
  </script>
</body>
</html>
