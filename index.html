<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>駕駛疲勞偵測與緊急警報系統</title>
  
  <!-- p5.js 函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
  
  <!-- 關鍵修正：透過 unpkg CDN 載入精確的 ml5@0.12.2 版本 (避免 404 及 CORS 問題) -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js" type="text/javascript"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #38bdf8;
      --alert-color: #ef4444;
      --safe-color: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent-color);
      letter-spacing: 1px;
      text-align: center;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .status-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .status-value.awake { color: var(--safe-color); }
    .status-value.drowsy { color: var(--alert-color); animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: #000;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    .log-container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 140px;
      overflow-y: auto;
      color: var(--text-sub);
    }

    .log-item {
      margin-bottom: 4px;
    }

    .log-time {
      color: var(--accent-color);
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <h1 class="header-title">🚨 駕駛疲勞偵測與緊急警報系統0725</h1>

  <div class="main-container">
    <div class="dashboard-grid">
      <div class="status-card">
        <span class="status-title">當前生理狀態</span>
        <span id="label-display" class="status-value awake">初始化中...</span>
      </div>
      <div class="status-card">
        <span class="status-title">GPS 定位狀態</span>
        <span id="gps-status" class="status-value" style="color: #f59e0b; font-size: 1rem;">定位中...</span>
      </div>
      <div class="status-card">
        <span class="status-title">GAS 雲端同步</span>
        <span id="gas-status" class="status-value" style="color: var(--accent-color);">待命</span>
      </div>
      <div class="status-card">
        <span class="status-title">AI 模型狀態</span>
        <span id="model-status" class="status-value" style="color: #f59e0b;">載入中...</span>
      </div>
    </div>

    <div id="canvas-container" class="canvas-wrapper"></div>

    <div class="log-container" id="log-box">
      <div class="log-item"><span class="log-time">[系統]</span> 啟動中，正在請求相機與 GPS 權限...</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzR-0dO8nyrTmckOUljWXDD8whv9hJMPxmgRJaBzqZBUgR5zPt52Og26LgbGh1vCjSCZQ/exec"; 

    let video;
    let facemesh;
    let predictLabel = "清醒";
    let predictions = [];
    let nn;
    let loading = true;
    let lastLabel = "";

    const videoSizeW = 640;
    const videoSizeH = 480;

    let isPredicting = false;
    let drowsyCounter = 0;
    const DROWSY_THRESHOLD = 1;

    let currentLat = "無";
    let currentLng = "無";

    function addLog(msg) {
      const logBox = document.getElementById("log-box");
      const timeStr = new Date().toLocaleTimeString();
      const newLog = document.createElement("div");
      newLog.className = "log-item";
      newLog.innerHTML = `<span class="log-time">[${timeStr}]</span> ${msg}`;
      logBox.appendChild(newLog);
      
      if (logBox.children.length > 50) {
        logBox.removeChild(logBox.firstChild);
      }
      logBox.scrollTop = logBox.scrollHeight;
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude.toFixed(6);
            currentLng = position.coords.longitude.toFixed(6);
            document.getElementById("gps-status").innerText = `${currentLat}, ${currentLng}`;
            document.getElementById("gps-status").style.color = "var(--safe-color)";
          },
          (error) => {
            console.warn("GPS 定位失敗:", error.message);
            document.getElementById("gps-status").innerText = "無法定位";
            document.getElementById("gps-status").style.color = "var(--alert-color)";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        document.getElementById("gps-status").innerText = "不支援 GPS";
      }
    }

    function sendToGAS(statusLabel) {
      if (!GAS_URL || GAS_URL.includes("YOUR_DEPLOYMENT_ID")) {
        document.getElementById("gas-status").innerText = "未設定網址";
        return;
      }

      document.getElementById("gas-status").innerText = "上傳中...";
      document.getElementById("gas-status").style.color = "#f59e0b";

      const payload = {
        status: statusLabel,
        lat: currentLat,
        lng: currentLng
      };

      fetch(GAS_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          document.getElementById("gas-status").innerText = "已同步";
          document.getElementById("gas-status").style.color = "var(--safe-color)";
          addLog(`雲端記錄成功 (${statusLabel}) ${statusLabel === '打瞌睡' ? '🚨 已觸發 LINE 警報' : ''}`);
        } else {
          throw new Error(data.message || "未知錯誤");
        }
      })
      .catch((err) => {
        document.getElementById("gas-status").innerText = "失敗";
        document.getElementById("gas-status").style.color = "var(--alert-color)";
        console.error("GAS 傳送失敗:", err);
      });
    }

    function checkStatus() {
      if (predictLabel !== lastLabel) {
        sendToGAS(predictLabel);
        lastLabel = predictLabel;

        const labelDisplay = document.getElementById("label-display");
        labelDisplay.innerText = predictLabel;
        if (predictLabel === "打瞌睡") {
          labelDisplay.className = "status-value drowsy";
        } else {
          labelDisplay.className = "status-value awake";
        }
      }
    }

    function getCurrentData() {
      let inputData = [];
      if (predictions.length > 0 && predictions[0].scaledMesh) {
        const mesh = predictions[0].scaledMesh;
        
        for (let j = 0; j < mesh.length; j++) {
          inputData.push(mesh[j][0]);
          inputData.push(mesh[j][1]);
        }
      }

      while (inputData.length < 1044) {
        inputData.push(0);
      }

      if (inputData.length > 1044) {
        inputData = inputData.slice(0, 1044);
      }

      return inputData;
    }

    function predictData() {
      if (isPredicting || predictions.length === 0 || loading) return;

      let inputData = getCurrentData();

      if (inputData.length === 1044) {
        isPredicting = true;
        nn.classify(inputData, gotResults);
      }
    }

    function gotResults(error, results) {
      isPredicting = false;
      if (error) {
        console.error("預測失敗:", error);
        return;
      }

      if (results && results.length > 0) {
        let rawLabel = results[0].label;
        let confidence = (results[0].confidence * 100).toFixed(1);

        console.log(`[AI 判定] 標籤: ${rawLabel} (${confidence}%)`);

        if (rawLabel === "打瞌睡") {
          drowsyCounter++;
        } else {
          drowsyCounter = 0;
          predictLabel = "清醒";
        }

        if (drowsyCounter >= DROWSY_THRESHOLD) {
          predictLabel = "打瞌睡";
        }

        checkStatus();
      }
    }

    function uploadModel() {
      const modelInfo = {
        model: 'model.json',
        metadata: 'model_meta.json',
        weights: 'model.weights.bin',
      };
      
      addLog("正在載入自訂分類模型 (model.json)...");
      nn.load(modelInfo, modelLoaded);
    }

    function modelLoaded() {
      console.log("分類器模型載入完成");
      loading = false;
      document.getElementById("model-status").innerText = "就緒";
      document.getElementById("model-status").style.color = "var(--safe-color)";
      document.getElementById("label-display").innerText = "清醒";
      addLog("AI 模組已就緒，啟動即時監測！");
    }

    function faceModelReady() {
      console.log("FaceMesh 模型讀取完畢");
      addLog("FaceMesh 網域解析與下載成功！");
      
      facemesh.on("predict", (results) => {
        predictions = results;
        if (predictions.length > 0) {
          predictData();
        }
      });
      uploadModel();
    }

    function setup() {
      const canvas = createCanvas(videoSizeW, videoSizeH);
      canvas.parent("canvas-container");

      video = createCapture({
        audio: false,
        video: {
          width: { ideal: videoSizeW },
          height: { ideal: videoSizeH },
          facingMode: "user"
        }
      });
      video.size(videoSizeW, videoSizeH);
      video.hide();

      const options = {
        inputs: 1044,
        outputs: 2,
        task: 'classification',
        debug: false
      };
      nn = ml5.neuralNetwork(options);

      facemesh = ml5.facemesh(video, faceModelReady);
      initGPS();
    }

    function drawKeypoints(scaleFactor, offsetX, offsetY) {
      if (predictions.length === 0) return;

      fill(56, 189, 248);
      noStroke();

      for (let i = 0; i < predictions.length; i++) {
        const keypoints = predictions[i].scaledMesh;
        for (let j = 0; j < keypoints.length; j++) {
          const [x, y] = keypoints[j];
          let mappedX = x * scaleFactor + offsetX;
          let mappedY = y * scaleFactor + offsetY;

          ellipse(mappedX, mappedY, 3, 3);
        }
      }
    }

    function draw() {
      background(15, 23, 42);

      let vW = video.elt.videoWidth || videoSizeW;
      let vH = video.elt.videoHeight || videoSizeH;

      let scaleFactor = Math.max(width / vW, height / vH);
      let renderW = vW * scaleFactor;
      let renderH = vH * scaleFactor;
      let offsetX = (width - renderW) / 2;
      let offsetY = (height - renderH) / 2;

      push();
      translate(width, 0);
      scale(-1, 1);

      image(video, offsetX, offsetY, renderW, renderH);
      drawKeypoints(scaleFactor, offsetX, offsetY);
      pop();

      if (loading) {
        fill(0, 0, 0, 180);
        rect(0, 0, width, height);
        fill(255);
        textAlign(CENTER, CENTER);
        textSize(24);
        text("系統與 AI 模型載入中...", width / 2, height / 2);
      } else if (predictLabel === "打瞌睡") {
        fill(239, 68, 68, 80);
        rect(0, 0, width, height);

        fill(255);
        textAlign(CENTER, CENTER);
        textSize(42);
        textStyle(BOLD);
        text("⚠️ 警告：請保持清醒！", width / 2, height / 2);
      }
    }
  </script>
</body>
</html>
